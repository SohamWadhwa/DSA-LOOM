name: Test all solutions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solutions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test all 93 implementations and documentation links
        run: python tests/run.py
      - name: Check native memory safety
        run: python tests/run.py --languages c cpp --sanitize
